<h2 mat-dialog-title style="color:#52b788;">Share Session</h2>

<mat-dialog-content style="text-align:center; padding:16px;">
  <canvas #qrCanvas style="border-radius:8px;" role="img" aria-label="QR code to share this session"></canvas>
  <p class="text-muted text-small" style="margin-top:12px; word-break:break-all;">
    {{ data.url }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="copyUrl()" [attr.aria-label]="copied ? 'URL copied to clipboard' : 'Copy session URL'">
    {{ copied ? 'Copied!' : 'Copy URL' }}
  </button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
